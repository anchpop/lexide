name: lexide-byt5-base

resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 200

workdir: .

setup: |
  # GH200 is ARM (aarch64) — no CUDA PyTorch wheels on PyPI.
  # Use Lambda's pre-installed system python3-torch-cuda instead.
  pip uninstall -y torch 2>/dev/null || true
  sudo rm -rf /usr/lib/python3/dist-packages/flatbuffers* 2>/dev/null || true
  /usr/bin/python3 -m pip install --upgrade pip
  /usr/bin/python3 -m pip install \
    "transformers>=4.50,<4.57" \
    "numpy<2" \
    wandb tqdm sentencepiece protobuf huggingface_hub \
    peft accelerate tf-keras

envs:
  WANDB_API_KEY: ${WANDB_API_KEY}
  HF_TOKEN: ${HF_TOKEN}
  HF_USERNAME: anchpop
  CUDA_VISIBLE_DEVICES: "0"

run: |
  set -e
  cd ~/sky_workdir
  mkdir -p output/byt5_base output/eval

  echo "=========================================="
  echo "Training: ByT5-base + LoRA (unified NLP)"
  echo "=========================================="
  /usr/bin/python3 src/byt5_xxl_train.py \
    --data_dir data \
    --output_dir output/byt5_base \
    --model_name google/byt5-base \
    --max_length 2048 \
    --batch_size 2 \
    --grad_accum 8 \
    --num_epochs 10 \
    --lora_lr 2e-5 \
    --head_lr 1e-3 \
    --lora_r 64 \
    --lora_alpha 128 \
    --lemma_tokens_per_sent 4 \
    --num_workers 4 \
    --wandb \
    --run_name byt5-base-lora

  echo "=========================================="
  echo "Done!"
  echo "=========================================="
