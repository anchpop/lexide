[package]
name = "lexide-preprocess"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
g2p = { git = "https://github.com/anchpop/g2p", rev = "db3cc12b4f2cf916342304c83314f4cabc8993f7" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
dotenvy = "0.15"
earshot = "=1.1.0"
futures = "0.3"
hound = "3.5"
indicatif = "0.17"
reqwest = { version = "0.12", features = ["json", "multipart"] }
schemars = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "time"] }
tysm = "=0.18.0"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
unicode-general-category = "1"
