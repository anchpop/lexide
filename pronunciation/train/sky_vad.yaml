resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 200

  autostop:
    idle_minutes: 120
    down: true

workdir: .

file_mounts:
  ~/.netrc: ~/.netrc

setup: |
  cd ~/sky_workdir
  pip install --index-url https://download.pytorch.org/whl/cu128 'torch>=2.8' 'torchaudio>=2.8'
  pip install transformers datasets soundfile tqdm wandb

run: |
  cd ~/sky_workdir
  export CUDA_VISIBLE_DEVICES=0
  export WANDB_PROJECT="lexide-pronunciation"
  export WANDB_API_KEY=${WANDB_API_KEY}
  export HF_TOKEN=${HF_TOKEN}

  hf download anchpop/lexide-pronunciation-audio --repo-type dataset --local-dir ~/data

  # Same config as sky_unified.yaml, but with VAD anchor enabled:
  # --vad-weight 0.05 makes the BCE-against-earshot-VAD loss contribute
  # ~18% of total loss early (when model strongly disagrees with VAD) and
  # ~4% in steady state. Soft anchor: pushes nonblank_head toward
  # acoustic ground truth without dominating CTC's peaky-emission training.
  python -m src.train_unified \
    --data-dir ~/data \
    --model-name facebook/wav2vec2-xls-r-2b \
    --processor-source facebook/wav2vec2-xlsr-53-espeak-cv-ft \
    --gradient-checkpointing \
    --epochs 7 \
    --batch-size 16 \
    --backbone-lr 1e-5 \
    --head-lr 1e-3 \
    --stress-weight 0.3 \
    --stress-warmup-steps 400 \
    --vad-weight 0.05 \
    --num-workers 16 \
    --bf16 \
    --save-dir checkpoints-unified-vad \
    --hf-repo anchpop/lexide-pronunciation-unified-vad

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
