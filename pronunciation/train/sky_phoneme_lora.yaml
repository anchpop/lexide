resources:
  cloud: lambda
  accelerators: {GH200:1, H100:1}
  disk_size: 200

  autostop:
    idle_minutes: 30
    down: true

workdir: .

file_mounts:
  ~/.netrc: ~/.netrc
  ~/data: ../data/audio

setup: |
  cd ~/sky_workdir
  pip install --index-url https://download.pytorch.org/whl/cu128 'torch>=2.8' 'torchaudio>=2.8'
  pip install transformers datasets soundfile tqdm wandb peft

run: |
  cd ~/sky_workdir
  export CUDA_VISIBLE_DEVICES=0
  export WANDB_PROJECT="lexide-pronunciation"
  export WANDB_API_KEY=${WANDB_API_KEY}
  export HF_TOKEN=${HF_TOKEN}

  # LoRA on xls-r-2b backbone + full lm_head retrain.
  # Targets attention q/k/v across all 48 layers at rank=16 (~9M LoRA params)
  # plus the ~753K lm_head. Lets the self-supervised-pretrained backbone specialize
  # for phoneme classification without a full 2B-param retrain.
  #
  # Training script merges LoRA into the base model before saving, so the HF repo
  # holds a vanilla Wav2Vec2ForCTC (~8GB). Modal load is the standard
  # `Wav2Vec2ForCTC.from_pretrained(MODEL_ID)` — no peft dependency on the
  # inference side.
  python -m src.train_phoneme \
    --data-dir ~/data \
    --model-name facebook/wav2vec2-xls-r-2b \
    --processor-source facebook/wav2vec2-xlsr-53-espeak-cv-ft \
    --vocab-size 392 \
    --lora \
    --lora-rank 16 \
    --gradient-checkpointing \
    --epochs 5 \
    --batch-size 32 \
    --lr 3e-4 \
    --num-workers 16 \
    --bf16 \
    --save-dir checkpoints-phoneme-lora \
    --hf-repo anchpop/lexide-pronunciation-phoneme-xls-r-2b-lora

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
