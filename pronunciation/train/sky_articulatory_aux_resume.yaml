resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 200

  autostop:
    idle_minutes: 120
    down: true

workdir: .

file_mounts:
  ~/.netrc: ~/.netrc

setup: |
  cd ~/sky_workdir
  pip install --index-url https://download.pytorch.org/whl/cu128 'torch>=2.8' 'torchaudio>=2.8'
  pip install transformers datasets soundfile tqdm wandb panphon

run: |
  cd ~/sky_workdir
  export CUDA_VISIBLE_DEVICES=0
  export WANDB_PROJECT="lexide-pronunciation"
  export WANDB_API_KEY=${WANDB_API_KEY}
  export HF_TOKEN=${HF_TOKEN}
  # Combats CUDA allocator fragmentation. Job 6's OOM showed 34 GB
  # "reserved but unallocated" — fragmentation, not true exhaustion.
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

  pip install --quiet panphon

  hf download anchpop/lexide-pronunciation-audio --repo-type dataset --local-dir ~/data

  # Resume the factorial-feature-CTC aux run from its E2 checkpoint. The
  # previous run (sky_articulatory_aux.yaml, job 4) was cancelled mid-E3
  # after we landed a vectorized factorial CTC DP — restart from E3 with
  # the faster code to avoid re-running E1+E2.
  hf download anchpop/lexide-pronunciation-unified-articulatory-aux \
    --local-dir ~/resume-checkpoint

  python -m src.train_unified \
    --data-dir ~/data \
    --model-name facebook/wav2vec2-xls-r-2b \
    --processor-source facebook/wav2vec2-xlsr-53-espeak-cv-ft \
    --gradient-checkpointing \
    --epochs 7 \
    --batch-size 16 \
    --backbone-lr 1e-5 \
    --head-lr 1e-3 \
    --stress-weight 0.3 \
    --stress-warmup-steps 400 \
    --vad-weight 0.05 \
    --use-aux-features \
    --feature-aux-weight 0.1 \
    --num-workers 16 \
    --bf16 \
    --resume-from ~/resume-checkpoint \
    --resume-epoch 5 \
    --save-dir checkpoints-unified-articulatory-aux \
    --hf-repo anchpop/lexide-pronunciation-unified-articulatory-aux

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
