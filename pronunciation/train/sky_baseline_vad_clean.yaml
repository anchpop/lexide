resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 200

  autostop:
    idle_minutes: 120
    down: true

workdir: .

file_mounts:
  ~/.netrc: ~/.netrc
  # Upload local data/audio/ directly to the cluster instead of hf-downloading
  # at run time. Sky uses rsync for local-path mounts which is much faster
  # than the HF↔Lambda link. train.sh detects ~/data is already populated and
  # skips its hf download step.
  ~/data: /Users/andrepopovitch/coding/lexide/pronunciation/data/audio

setup: |
  cd ~/sky_workdir
  pip install --index-url https://download.pytorch.org/whl/cu128 'torch>=2.8' 'torchaudio>=2.8'
  pip install transformers datasets soundfile tqdm wandb panphon

run: |
  # Baseline + VAD on the cleaned dataset (i.e. with audit exclusions applied
  # to FLEURS + Tatoeba via the auto-loaded *_asr_exclusions.jsonl sidecars).
  # No articulatory aux supervision, no regularized heads — just the direct
  # phoneme head + nonblank + stress trained on cleaner data. Reference point
  # for A/B comparing the articulatory variants against the same clean data.
  bash train/train.sh \
    --vad-weight 0.05 \
    --save-dir checkpoints-unified-vad-clean \
    --hf-repo anchpop/lexide-pronunciation-unified-vad-clean

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
