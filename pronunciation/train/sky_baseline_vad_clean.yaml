resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 200

  autostop:
    idle_minutes: 120
    down: true

workdir: .

file_mounts:
  ~/.netrc: ~/.netrc
  # Ship the dataset as ONE tarball, not 374k loose files. Syncing the loose
  # data/audio dir (rsync OR hf-download) dies on per-file overhead (~2-8k files
  # then a hang/status-255). A single tar transfers at full uplink (~26 MB/s →
  # ~18 min for 28 GB). `run:` untars it into ~/data before training. Rebuild the
  # tar after any data/label change:
  #   tar -cf /Volumes/T7/pron_audio.tar -C data/audio --exclude=.cache .
  ~/data.tar: /Volumes/T7/pron_audio.tar

setup: |
  cd ~/sky_workdir
  pip install --index-url https://download.pytorch.org/whl/cu128 'torch>=2.8' 'torchaudio>=2.8'
  pip install transformers datasets soundfile tqdm wandb panphon

run: |
  # Unpack the dataset tarball into ~/data (train.sh then sees it populated and
  # skips its hf-download). Idempotent: skip if already extracted (e.g. requeue).
  if [ ! -e ~/data/eng/phonemes.jsonl ]; then
    mkdir -p ~/data && tar -xf ~/data.tar -C ~/data && rm -f ~/data.tar
  fi
  echo "data langs: $(ls ~/data | tr '\n' ' ')"

  # Baseline + VAD on the cleaned dataset (i.e. with audit exclusions applied
  # to FLEURS + Tatoeba via the auto-loaded *_asr_exclusions.jsonl sidecars).
  # No articulatory aux supervision, no regularized heads — just the direct
  # phoneme head + nonblank + stress trained on cleaner data. Reference point
  # for A/B comparing the articulatory variants against the same clean data.
  bash train/train.sh \
    --vad-weight 0.05 \
    --save-dir checkpoints-unified-vad-clean \
    --hf-repo anchpop/lexide-pronunciation-unified-vad-clean

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
