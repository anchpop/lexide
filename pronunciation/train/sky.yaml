resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 200

  autostop:
    idle_minutes: 120
    down: true

workdir: .

file_mounts:
  ~/.netrc: ~/.netrc

setup: |
  cd ~/sky_workdir
  # Pin torch >= 2.8 (matches pyproject) — transformers 5.x requires >= 2.6 (CVE-2025-32434).
  # cu128 has aarch64 wheels for GH200; cu124 ships older torch on aarch64.
  pip install --index-url https://download.pytorch.org/whl/cu128 'torch>=2.8' 'torchaudio>=2.8'
  pip install transformers datasets soundfile tqdm wandb
  # Pull audio + phoneme labels from the private HF dataset (faster than rsync
  # over local wifi). `hf download` is idempotent on re-runs.
  hf download anchpop/lexide-pronunciation-audio --repo-type dataset --local-dir ~/data

run: |
  cd ~/sky_workdir
  export CUDA_VISIBLE_DEVICES=0
  export WANDB_PROJECT="lexide-pronunciation"
  export WANDB_API_KEY=${WANDB_API_KEY}
  export HF_TOKEN=${HF_TOKEN}

  # Audio + phoneme labels are pulled from the private HF dataset during setup
  # (see above), so a fresh cluster doesn't need anything beyond the workdir.

  # Stress head training on top of the xls-r-2b phoneme backbone. The bigger
  # backbone (1920 hidden × 49 layers vs xlsr-53's 1024 × 25) means activations
  # retained for the SUPERB-style layer-weighted probe are ~4x bigger, so we cut
  # batch from 64 to 32 and halve lr to compensate.
  python -m src.train \
    --data-dir ~/data \
    --epochs 10 \
    --batch-size 32 \
    --lr 2e-3 \
    --num-workers 16 \
    --bf16 \
    --save-dir checkpoints \
    --hf-repo anchpop/lexide-pronunciation-stress

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
