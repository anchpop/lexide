resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 200

  autostop:
    idle_minutes: 30
    down: true

workdir: .

file_mounts:
  ~/.netrc: ~/.netrc
  ~/data: ../data/audio

setup: |
  cd ~/sky_workdir
  # Pin torch >= 2.8 (matches pyproject) — transformers 5.x requires >= 2.6 (CVE-2025-32434).
  # cu128 has aarch64 wheels for GH200; cu124 ships older torch on aarch64.
  pip install --index-url https://download.pytorch.org/whl/cu128 'torch>=2.8' 'torchaudio>=2.8'
  pip install transformers datasets soundfile tqdm wandb

run: |
  cd ~/sky_workdir
  export CUDA_VISIBLE_DEVICES=0
  export WANDB_PROJECT="lexide-pronunciation"
  export WANDB_API_KEY=${WANDB_API_KEY}
  export HF_TOKEN=${HF_TOKEN}

  # Phoneme data must be already preprocessed locally (before sky launch).
  # Audio dir is mounted read-only at ~/data via file_mounts above.

  # GH200 config: bf16, batch=64 (96GB HBM3, room to grow), lr linearly scaled
  # from the original 1e-3 @ batch 8 baseline, 16 dataloader workers.
  python -m src.train \
    --data-dir ~/data \
    --epochs 10 \
    --batch-size 64 \
    --lr 4e-3 \
    --num-workers 16 \
    --bf16 \
    --save-dir checkpoints \
    --hf-repo anchpop/lexide-pronunciation-stress-xlsr53

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
