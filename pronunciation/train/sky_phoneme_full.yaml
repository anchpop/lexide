resources:
  cloud: lambda
  accelerators: {GH200:1, H100:1}
  disk_size: 200

  autostop:
    idle_minutes: 30
    down: true

workdir: .

file_mounts:
  ~/.netrc: ~/.netrc
  ~/data: ../data/audio

setup: |
  cd ~/sky_workdir
  pip install --index-url https://download.pytorch.org/whl/cu128 'torch>=2.8' 'torchaudio>=2.8'
  pip install transformers datasets soundfile tqdm wandb

run: |
  cd ~/sky_workdir
  export CUDA_VISIBLE_DEVICES=0
  export WANDB_PROJECT="lexide-pronunciation"
  export WANDB_API_KEY=${WANDB_API_KEY}
  export HF_TOKEN=${HF_TOKEN}

  # Full fine-tune of xls-r-2b for phoneme CTC. Trains all 2.16B params, mimicking
  # what Meta did to produce the original espeak-cv-ft variants on xlsr-53.
  # Lower lr (1e-5) because the whole backbone is moving; gradient checkpointing
  # keeps activation memory manageable. Small batch (16) for the same reason —
  # bump if memory headroom permits.
  python -m src.train_phoneme \
    --data-dir ~/data \
    --model-name facebook/wav2vec2-xls-r-2b \
    --processor-source facebook/wav2vec2-xlsr-53-espeak-cv-ft \
    --vocab-size 392 \
    --full-finetune \
    --gradient-checkpointing \
    --epochs 5 \
    --batch-size 16 \
    --lr 1e-5 \
    --num-workers 16 \
    --bf16 \
    --save-dir checkpoints-phoneme-full \
    --hf-repo anchpop/lexide-pronunciation-phoneme-xls-r-2b-full

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
