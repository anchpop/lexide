resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 200

  autostop:
    idle_minutes: 120
    down: true

workdir: .

file_mounts:
  ~/.netrc: ~/.netrc

setup: |
  cd ~/sky_workdir
  pip install --index-url https://download.pytorch.org/whl/cu128 'torch>=2.8' 'torchaudio>=2.8'
  pip install transformers datasets soundfile tqdm wandb panphon

run: |
  # Unified articulatory factors: direct phoneme identity and articulatory
  # features score the same CTC emission. Phoneme factor weight is 1.0;
  # feature-vector factor weight is 0.3. The older separate factorial aux
  # CTC is disabled for this run.
  bash train/train.sh \
    --vad-weight 0.05 \
    --use-aux-features \
    --feature-emission-weight 0.3 \
    --feature-aux-weight 0.0 \
    --save-dir checkpoints-unified-articulatory-aux \
    --hf-repo anchpop/lexide-pronunciation-unified-articulatory-aux

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
