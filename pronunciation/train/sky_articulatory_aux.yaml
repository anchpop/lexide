resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 200

  autostop:
    idle_minutes: 120
    down: true

workdir: .

file_mounts:
  ~/.netrc: ~/.netrc

setup: |
  cd ~/sky_workdir
  pip install --index-url https://download.pytorch.org/whl/cu128 'torch>=2.8' 'torchaudio>=2.8'
  pip install transformers datasets soundfile tqdm wandb panphon

run: |
  # Articulatory features as AUXILIARY supervision via factorial feature CTC.
  # Direct phoneme head handles main CTC (no cold start). The feature head
  # emits F=24 independent 3-way feature distributions per frame; targets are
  # the phoneme sequence re-encoded through the feature table. A custom CTC
  # forward pass keeps one shared alignment over whole feature vectors, so
  # comparison happens in feature space — signature-colliding phonemes share
  # supervision instead of being penalized for not being distinguishable in
  # feature space.
  bash train/train.sh \
    --vad-weight 0.05 \
    --use-aux-features \
    --feature-aux-weight 0.1 \
    --save-dir checkpoints-unified-articulatory-aux \
    --hf-repo anchpop/lexide-pronunciation-unified-articulatory-aux

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
