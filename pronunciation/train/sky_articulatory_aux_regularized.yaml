resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 200

  autostop:
    idle_minutes: 120
    down: true

workdir: .

file_mounts:
  ~/.netrc: ~/.netrc
  # See sky_baseline_vad_clean.yaml's note: sky rsyncs local data/audio/ much
  # faster than the HF↔Lambda link, and train.sh detects the pre-mount and
  # skips its hf download step.
  ~/data: /Users/andrepopovitch/coding/lexide/pronunciation/data/audio

setup: |
  cd ~/sky_workdir
  pip install --index-url https://download.pytorch.org/whl/cu128 'torch>=2.8' 'torchaudio>=2.8'
  pip install transformers datasets soundfile tqdm wandb panphon

run: |
  # Factorial feature CTC aux mode + regularized heads. On top of the aux
  # baseline this adds three head-regularization tweaks:
  #   (1) K=5 learned softmax mixtures over the 49 wav2vec2 hidden states,
  #       concatenated → (B, T, 5*1920). Each mixture is initialized peaked
  #       at a different evenly-spaced layer (0, 12, 24, 36, 48) so they
  #       start diverse; the model is free to broaden, sharpen, or shift
  #       each peak during training.
  #   (2) log-mel acoustic side-channel concatenated with the encoder output
  #       (direct access to waveform-derived signal that the encoder may
  #       have discarded).
  #   (3) shared Linear(5*1920+64, 768) base feeding all four heads.
  #       Phoneme + feature heads share a learned projection — they predict
  #       overlapping information by construction.
  # Adds ~7.8M new params (vs ~1.4M baseline). A/B target: same unified
  # feature-emission setup without --regularized-heads.
  bash train/train.sh \
    --vad-weight 0.05 \
    --use-aux-features \
    --feature-emission-weight 0.3 \
    --feature-aux-weight 0.0 \
    --regularized-heads \
    --save-dir checkpoints-unified-articulatory-aux-regularized \
    --hf-repo anchpop/lexide-pronunciation-unified-articulatory-aux-regularized

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
