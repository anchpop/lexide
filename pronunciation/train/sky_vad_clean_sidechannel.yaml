resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 200

  autostop:
    idle_minutes: 120
    down: true

workdir: .

file_mounts:
  ~/.netrc: ~/.netrc
  # One-tarball dataset staging (374k loose files choke rsync/hf-download).
  #   tar -cf /Volumes/T7/pron_audio.tar -C data/audio --exclude=.cache .
  ~/data.tar: /Volumes/T7/pron_audio.tar

setup: |
  cd ~/sky_workdir
  pip install --index-url https://download.pytorch.org/whl/cu128 'torch>=2.8' 'torchaudio>=2.8'
  pip install transformers datasets soundfile tqdm wandb panphon

run: |
  if [ ! -e ~/data/eng/phonemes.jsonl ]; then
    mkdir -p ~/data && tar -xf ~/data.tar -C ~/data && rm -f ~/data.tar
  fi
  echo "data langs: $(ls ~/data | tr '\n' ' ')"

  # A/B PARTNER of sky_vad_clean_narrowed12.yaml: IDENTICAL recipe (xls-r-2b,
  # narrowed labels, batch 16, no gradient checkpointing, 12 epochs, champion
  # LRs/weights) with exactly two additions:
  #   --mel-sidechannel : concat a raw log-mel projection onto the final encoder
  #     layer feeding the heads — the L0-style low-level acoustic the learned
  #     layer-mixture kept 5-45% mass on, WITHOUT the (collapsed) K-layer mixture.
  #   --mlp-heads       : nonblank + phoneme heads become din→din→GELU→dout MLPs
  #     (a cheap 'bigger head' on the 2B encoder).
  # So any delta vs the partner run isolates these two changes.
  bash train/train.sh \
    --no-gradient-checkpointing \
    --epochs 12 \
    --mel-sidechannel \
    --mlp-heads \
    --vad-weight 0.05 \
    --save-dir checkpoints-vad-clean-sidechannel \
    --hf-repo anchpop/lexide-pronunciation-vad-clean-sidechannel

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
