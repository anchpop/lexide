resources:
  cloud: lambda
  accelerators: {GH200:1, H100:1}
  disk_size: 200

  autostop:
    idle_minutes: 120
    down: true

workdir: .

file_mounts:
  ~/.netrc: ~/.netrc

setup: |
  cd ~/sky_workdir
  pip install --index-url https://download.pytorch.org/whl/cu128 'torch>=2.8' 'torchaudio>=2.8'
  pip install transformers datasets soundfile tqdm wandb
  # Pull audio + phoneme labels from the private HF dataset. Decouples cluster
  # bring-up from local wifi (cluster<->HF peering is fast; local<->cluster is
  # bottlenecked by whatever connection the user is on). `hf download` is
  # idempotent — re-running just verifies file hashes against the cache.
  hf download anchpop/lexide-pronunciation-audio --repo-type dataset --local-dir ~/data

run: |
  cd ~/sky_workdir
  export CUDA_VISIBLE_DEVICES=0
  export WANDB_PROJECT="lexide-pronunciation"
  export WANDB_API_KEY=${WANDB_API_KEY}
  export HF_TOKEN=${HF_TOKEN}

  # Full fine-tune of xls-r-2b for phoneme CTC across all 7 languages. Trains all
  # 2.16B params; lower lr (1e-5) because the whole backbone moves; gradient
  # checkpointing keeps activation memory manageable; batch=16 fits comfortably
  # on GH200's 96GB HBM at this scale.
  python -m src.train_phoneme \
    --data-dir ~/data \
    --model-name facebook/wav2vec2-xls-r-2b \
    --processor-source facebook/wav2vec2-xlsr-53-espeak-cv-ft \
    --vocab-size 392 \
    --gradient-checkpointing \
    --epochs 5 \
    --batch-size 16 \
    --lr 1e-5 \
    --num-workers 16 \
    --bf16 \
    --save-dir checkpoints-phoneme \
    --hf-repo anchpop/lexide-pronunciation-phoneme-xls-r-2b

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
