resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 200

  autostop:
    idle_minutes: 120
    down: true

workdir: .

file_mounts:
  ~/.netrc: ~/.netrc
  # Same one-tarball dataset staging as the other runs (374k loose files choke
  # rsync/hf-download). Rebuild after any data/label change:
  #   tar -cf /Volumes/T7/pron_audio.tar -C data/audio --exclude=.cache .
  ~/data.tar: /Volumes/T7/pron_audio.tar

setup: |
  cd ~/sky_workdir
  pip install --index-url https://download.pytorch.org/whl/cu128 'torch>=2.8' 'torchaudio>=2.8'
  pip install transformers datasets soundfile tqdm wandb panphon

run: |
  if [ ! -e ~/data/eng/phonemes.jsonl ]; then
    mkdir -p ~/data && tar -xf ~/data.tar -C ~/data && rm -f ~/data.tar
  fi
  echo "data langs: $(ls ~/data | tr '\n' ' ')"

  # Champion recipe (xls-r-2b, the @2926e06 settings via train.sh defaults:
  # batch 16, backbone-lr 1e-5, head-lr 1e-3, stress 0.3, vad 0.05, bf16) on the
  # NARROWED labels, with two changes:
  #   --no-gradient-checkpointing : the champion's 322 ms backward included a
  #     full recompute; off → identical math, just faster (xls-r batch 16 fits
  #     ~60-75 GB of the 97 GB GH200 without it). Pure speed, no dynamics change.
  #   --epochs 12 : tests whether the narrowed nasal regression was undertraining
  #     (champion ran 7, peaked ~epoch 3). T_max tracks --epochs so cosine anneals
  #     over the full 12.
  # Separate --hf-repo so it does NOT touch vad-clean's main (the published model).
  bash train/train.sh \
    --no-gradient-checkpointing \
    --epochs 12 \
    --vad-weight 0.05 \
    --save-dir checkpoints-vad-clean-narrowed12 \
    --hf-repo anchpop/lexide-pronunciation-vad-clean-narrowed12

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
