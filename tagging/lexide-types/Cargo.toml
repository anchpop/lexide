[package]
name = "lexide-types"
version = "0.1.0"
edition = "2024"
description = "Validated tokenization types for lexide, without inference or networking"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anchpop/lexide"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_plain = "1.0.2"
rkyv = { version = "0.8.18", optional = true }

[features]
rkyv = ["dep:rkyv"]

[dev-dependencies]
serde_json = "1.0.151"
