[package]
name = "lexide"
version = "0.3.0"
edition = "2021"
description = "Multilingual text analysis and pronunciation decoding, CTC scoring, and forced alignment"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anchpop/lexide"

[lib]
name = "lexide"
path = "src/lib.rs"

[[bin]]
name = "emit-priors"
path = "src/bin/emit_priors.rs"
required-features = ["segment"]

[[bin]]
name = "build-lemma-fst"
path = "src/bin/build_lemma_fst.rs"
required-features = ["local"]

[[bin]]
name = "label-tokenization"
path = "src/bin/label_tokenization.rs"
required-features = ["remote"]

[[example]]
name = "segment"
required-features = ["segment"]

[[example]]
name = "simple"
required-features = ["local"]

[[example]]
name = "concurrent"
required-features = ["local"]

[[example]]
name = "matching"
required-features = ["local"]

[dependencies]
g2p-types = { git = "https://github.com/anchpop/g2p", rev = "2eec7e1affb49ba1af91844039299730dd1d954e" }
# Async runtime shared by the local and remote backends only.
tokio = { version = "1.42", features = ["full"], optional = true }
# Core dependencies (serde also supports the always-available text types).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
serde_plain = "1.0.2"
futures = "0.3.31"
regex = "1.0"
unicode-normalization = "0.1"

# Local inference dependencies (only included with 'local' feature):
# the parsley tagger — ONNX encoder via ort, XLM-R subword tokenization via tokenizers,
# byte-minGRU segmenter weights via safetensors, Wiktionary lemma tables via fst.
ort = { version = "2.0.0-rc.10", optional = true }
tokenizers = { version = "0.21", optional = true }
safetensors = { version = "0.6", optional = true }
fst = { version = "0.4", optional = true }
hf-hub = { version = "0.4", optional = true, default-features = false, features = ["ureq", "native-tls"] }

# HTTP shared by the remote text and pronunciation clients.
reqwest = { version = "0.13", features = ["json"], optional = true }
http = { version = "1", optional = true }
osmo = { git = "https://github.com/anchpop/osmo", optional = true }
async-stream = { version = "0.3", optional = true }

# Offline pronunciation wire-format dependencies.
half = { version = "2", optional = true }
flate2 = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3"
# Loopback HTTP tests supply the runtime just like downstream callers.
tokio = { version = "1.42", features = ["rt"] }

[features]
# Backend selection - choose one (or both)
local = ["segment", "dep:ort", "dep:tokenizers", "dep:fst", "dep:tokio"]
# Just the 1M-param sentence segmenter (Segmenter::from_pretrained, ~4 MB download)
segment = ["dep:safetensors", "dep:hf-hub"]
remote = ["dep:reqwest", "dep:tokio"]
# Pure CPU frame decoding/scoring; no inference runtime or HTTP client.
pronunciation = ["dep:half", "dep:flate2", "dep:base64", "serde_json/raw_value"]
# Async audio preparation and HTTP; the caller supplies its runtime.
pronunciation-remote = ["pronunciation", "dep:reqwest", "dep:http", "dep:tokio", "dep:async-stream", "dep:osmo"]

[[example]]
name = "verify_frame_matrix"
required-features = ["pronunciation"]
