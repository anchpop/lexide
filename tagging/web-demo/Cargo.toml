[package]
name = "parsley-web-demo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
anyhow = "1.0"
safetensors = "0.6"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
half = "2"
flate2 = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
