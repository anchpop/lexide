[package]
name = "parsley-web-demo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
anyhow = "1.0"
safetensors = "0.6"
serde_json = { version = "1.0", features = ["raw_value"] }
g2p-types = { git = "https://github.com/anchpop/g2p", rev = "ef90533979a537469a2dc03546cb5d5c5d208c77" }
serde = { version = "1.0", features = ["derive"] }
half = "2"
flate2 = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
