name: lexide-distill

resources:
  cloud: lambda
  accelerators: GH200:1
  disk_size: 100

  autostop:
    idle_minutes: 30
    down: true

workdir: .

setup: |
  cd ~/sky_workdir
  /usr/bin/python3 -m pip install accelerate bitsandbytes datasets jsonlines 'peft>=0.18.1' scikit-learn \
    sentencepiece tqdm 'transformers>=4.57.0' trl wandb 'Pillow>=9.1.0' 'numpy<2' tf-keras

run: |
  cd ~/sky_workdir
  export CUDA_VISIBLE_DEVICES=0
  export WANDB_PROJECT="lexide"
  export TOKENIZERS_PARALLELISM=false
  export HF_TOKEN=${HF_TOKEN}
  export WANDB_API_KEY=${WANDB_API_KEY}
  export HF_USERNAME=${HF_USERNAME}

  # Teacher adapter is pulled from HF (default: anchpop/lexide-gemma-4-31B-it)
  export TEACHER_ADAPTER=${TEACHER_ADAPTER}

  for STUDENT in ${STUDENT_MODELS}; do
    echo "=== Distilling into ${STUDENT} ==="
    export STUDENT_MODEL="${STUDENT}"
    /usr/bin/python3 -m accelerate.commands.launch \
      --mixed_precision bf16 \
      --num_processes 1 \
      --num_machines 1 \
      --dynamo_backend no \
      src/distill.py
  done

envs:
  TEACHER_ADAPTER: anchpop/lexide-gemma-4-31B-it
  STUDENT_MODELS: "gemma-4-E4B-it"
  HF_USERNAME: anchpop

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null

file_mounts:
  ~/.netrc: ~/.netrc
