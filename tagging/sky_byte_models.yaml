# Train the two byte-minGRU models (char tokenizer + sentence segmenter) — the v2
# lang-token, bigger-architecture run. CPU-heavy sequential scan, so any small Ampere+
# GPU is fine; the tokenizer's 2.9M-sentence dataset is the long pole.
#
#   export HF_TOKEN=<write token from lexide/.env>
#   sky launch -c parsley-byte tagging/sky_byte_models.yaml \
#       --secret HF_TOKEN -i 20 --down -y --retry-until-up
#
# Checkpoints + metrics upload to HF anchpop/lexide-parsley under training-runs/byte-v2/
# as each model finishes; pull them locally for export + release (see tagger/README.md).
name: parsley-byte

resources:
  cloud: lambda
  accelerators:
    A6000: 1
    A10: 1
    L40S: 1
    A100: 1
  disk_size: 100

workdir: /data/coding/lexide/tagging   # .skyignore trims this to code + processed data

setup: |
  set -e
  if ! python3 -c "import torch, sys; sys.exit(0 if torch.cuda.is_available() else 1)" 2>/dev/null; then
    pip install --quiet "torch==2.7.0" --index-url https://download.pytorch.org/whl/cu128
  fi
  python3 -c "import torch; assert torch.cuda.is_available(), 'torch still cannot see CUDA after setup'"
  pip install --quiet huggingface_hub 'numpy<2'

run: |
  set -e
  cd ~/sky_workdir

  if [ "${SKIP_SEG}" != "1" ]; then
    echo "=== sentence segmenter: seed sweep [${SEG_SEEDS}] ==="
    for SEED in ${SEG_SEEDS}; do
      echo "=== seed ${SEED} ==="
      python3 sentence-labeller/train_segmenter.py \
          --data-dir sentence-labeller/processed --out-dir "output/segmenter-s${SEED}" \
          --epochs "${SEG_EPOCHS}" --workers 8 --seed "${SEED}"
      echo "=== pattern eval: seed ${SEED} ==="
      python3 sentence-labeller/eval_patterns.py \
          --ckpt "output/segmenter-s${SEED}/segmenter.pt" \
          --json-out "output/segmenter-s${SEED}/patterns.json"
    done
    echo "=== select winner (pattern pass rate, then val F1) ==="
    python3 sentence-labeller/select_best_seed.py
    echo "=== pattern eval: SHIPPED (byte-v4) reference ==="
    python3 -c "from huggingface_hub import hf_hub_download; print(hf_hub_download(
        'anchpop/lexide-parsley', 'training-runs/byte-v4/segmenter/segmenter.pt',
        local_dir='old-segmenter'))"
    python3 sentence-labeller/eval_patterns.py \
        --ckpt old-segmenter/training-runs/byte-v4/segmenter/segmenter.pt
    python3 tagger/hf_upload_run.py output/segmenter segmenter "${RUN_NAME}"
  fi

  if [ "${SKIP_TOK}" != "1" ]; then
    echo "=== char tokenizer (long) ==="
    python3 tagger/train_tokenizer.py \
        --data-dir data/processed --out-dir output/tokenizer \
        --epochs "${TOK_EPOCHS}" --batch-size "${TOK_BATCH}" --workers 8
    python3 tagger/hf_upload_run.py output/tokenizer tokenizer "${RUN_NAME}"
  fi

  echo "=== all done ==="

envs:
  SEG_SEEDS: "1 2 3"
  SEG_EPOCHS: "3"
  TOK_EPOCHS: "2"
  TOK_BATCH: "256"
  SKIP_SEG: "0"
  SKIP_TOK: "0"
  RUN_NAME: "byte-v5"
