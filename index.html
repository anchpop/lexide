<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lexide · segmentation</title>
<script src="./assets/theme.d45efdaf2d93c633.js"></script>
<link rel="stylesheet" href="./assets/demo.4678e990c17ac8ec.css">
</head>
<body>
<main>
  <nav class="demo-tabs" aria-label="Demos">
    <a href="./" aria-current="page">Segmentation</a>
    <a href="./pronunciation.html">Pronunciation</a>
  </nav>
  <header>
    <h1>parsley segmenter</h1>
    <nav>
      <select id="lang" title="language hint for segmentation">
        <option value="">lang: auto</option>
        <option value="deu">lang: deu</option>
        <option value="eng">lang: eng</option>
        <option value="fra">lang: fra</option>
        <option value="hin">lang: hin</option>
        <option value="ita">lang: ita</option>
        <option value="jpn">lang: jpn</option>
        <option value="kor">lang: kor</option>
        <option value="por">lang: por</option>
        <option value="rus">lang: rus</option>
        <option value="spa">lang: spa</option>
      </select>
      <button id="jpndict" title="japanese boundary dictionary — only affects japanese">jpn dict · 87mb</button>
      <a href="https://huggingface.co/anchpop/lexide-parsley" target="_blank" rel="noreferrer">model</a>
      <button id="theme"></button>
    </nav>
  </header>
  <div class="stats" id="stats">loading weights · 8mb</div>
  <textarea id="input" spellcheck="false" placeholder="paste a passage"></textarea>
  <div id="out"></div>
  <pre id="rust"></pre>
  <footer>
    <span>byte-minGRU ×2 · 1m params each</span>
    <span id="timing"></span>
  </footer>
</main>

<script type="module">
import init, { Parsley } from "./pkg/parsley_web_demo.js";

const $ = (id) => document.getElementById(id);

// weights: local copy first (build.sh drops them here), HF as fallback
const HF = "https://huggingface.co/anchpop/lexide-parsley/resolve/main/onnx";
async function fetchWeights(name) {
  for (const url of [`./${name}`, `${HF}/${name}`]) {
    try {
      const r = await fetch(url);
      if (r.ok) return new Uint8Array(await r.arrayBuffer());
    } catch { /* try next */ }
  }
  throw new Error(`could not fetch ${name} locally or from hf`);
}

// The Japanese dictionary is opt-in: 87mb, and it is the only language it changes.
// Without it Japanese still segments, just less accurately (the tokenizer is trained to
// run with no proposal at all); every other language's proposal is whitespace, which
// needs nothing downloaded and is already exact.
const dictBtn = $("jpndict");
let dictState = "off";
function paintDict() {
  const label = { off: "jpn dict · 87mb", loading: "jpn dict · loading", on: "jpn dict · on" }[dictState];
  dictBtn.textContent = label;
  dictBtn.disabled = dictState !== "off";
}
dictBtn.onclick = async () => {
  if (dictState !== "off" || !parsley) return;
  dictState = "loading";
  paintDict();
  try {
    parsley.load_japanese_dictionary(await fetchWeights("jpn-unidic.bin"));
    dictState = "on";
    render();
  } catch (e) {
    dictState = "off";
    $("stats").textContent = `jpn dict failed — ${String(e.message || e).toLowerCase()}`;
  }
  paintDict();
};

const DEFAULT_TEXT = `Dr. Smith arrived at 3 p.m. — he wasn't late. "Is this the place?" she asked. ¿Por qué se menciona "¿Dónde está la biblioteca?" en tantas películas/series de televisión?`;

let parsley = null;

const esc = (s) => s.replace(/ /g, "␣").replace(/\n/g, "⏎").replace(/\t/g, "⇥");

function render() {
  const out = $("out");
  out.textContent = "";
  const text = $("input").value;
  if (!parsley) return;
  if (!text.trim()) {
    out.innerHTML = `<div class="empty">no text — paste a passage to segment</div>`;
    $("rust").textContent = "";
    $("timing").textContent = "";
    return;
  }

  const lang = $("lang").value || null;
  const t0 = performance.now();
  const sentSpans = JSON.parse(parsley.sentence_spans(text, lang));
  const t1 = performance.now();

  const cps = Array.from(text);
  let tokTime = 0, nTok = 0, cursor = 0;

  const gapRow = (from, to) => {
    if (to <= from) return;
    const div = document.createElement("div");
    div.className = "gap-row";
    const g = document.createElement("span");
    g.className = "g";
    g.textContent = esc(cps.slice(from, to).join(""));
    div.append("gap · ", g);
    out.append(div);
  };

  sentSpans.forEach(([start, end], i) => {
    gapRow(cursor, start);
    cursor = end;
    const sentence = cps.slice(start, end).join("");

    const tk0 = performance.now();
    const tokSpans = JSON.parse(parsley.token_spans(sentence, lang));
    tokTime += performance.now() - tk0;
    nTok += tokSpans.length;

    const div = document.createElement("div");
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `s${i + 1} · [${start},${end}) · ${tokSpans.length} tokens`;
    const p = document.createElement("div");
    p.className = "sent";
    const scps = Array.from(sentence);
    let pos = 0;
    for (const [ti, [ts, te]] of tokSpans.entries()) {
      if (ts > pos) p.append(scps.slice(pos, ts).join(""));
      const span = document.createElement("span");
      span.className = ti % 2 ? "tok b" : "tok a";
      span.textContent = scps.slice(ts, te).join("");
      p.append(span);
      pos = te;
    }
    if (pos < scps.length) p.append(scps.slice(pos).join(""));
    div.append(meta, p);
    out.append(div);
  });
  gapRow(cursor, cps.length);

  $("timing").textContent =
    `segment ${(t1 - t0).toFixed(1)}ms · tokenize ${tokTime.toFixed(1)}ms`;
  $("stats").textContent =
    `${sentSpans.length} sentences · ${nTok} tokens · ${cps.length} chars`;
  $("rust").textContent = rustSnippet(text, lang, sentSpans, cps);
}

// The same segmentation, as the runnable Rust it takes (weights are shared, so this
// assert really passes). JSON string escaping is valid Rust except \uXXXX -> \u{XXXX}.
const LANG_NAME = {deu:"German", eng:"English", fra:"French", hin:"Hindi", ita:"Italian",
                   jpn:"Japanese", kor:"Korean", por:"Portuguese", rus:"Russian", spa:"Spanish"};
function rustStr(s) {
  return JSON.stringify(s).replace(/\\u([0-9a-fA-F]{4})/g, "\\u{$1}");
}
function rustSnippet(text, lang, sentSpans, cps) {
  const call = lang
    ? `parsley.segment_in(${rustStr(text)}, Language::${LANG_NAME[lang]})`
    : `parsley.segment(${rustStr(text)})`;
  const imports = lang ? "{Language, Segmenter}" : "Segmenter";
  const sentences = sentSpans
    .map(([s, e]) => "            " + rustStr(cps.slice(s, e).join("")) + ",")
    .join("\n");
  return `// cargo add lexide --features segment
use lexide::${imports};

fn main() -> anyhow::Result<()> {
    let parsley = Segmenter::from_pretrained()?; // ~4 mb download, cached
    assert_eq!(
        ${call},
        [
${sentences}
        ],
    );
    Ok(())
}`;
}

let timer = null;
$("input").oninput = () => {
  clearTimeout(timer);
  timer = setTimeout(render, 150);
};
$("lang").onchange = render;

try {
  const [, tokW, segW] = await Promise.all([
    init(),
    fetchWeights("char_tokenizer.safetensors"),
    fetchWeights("sentence_segmenter.safetensors"),
  ]);
  parsley = new Parsley(tokW, segW);
  paintDict();
  $("input").value = DEFAULT_TEXT;
  render();
} catch (e) {
  $("stats").textContent = `failed to load model — ${String(e.message || e).toLowerCase()}`;
}
</script>
</body>
</html>
