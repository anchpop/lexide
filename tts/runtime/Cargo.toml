[package]
name = "lexide-tts"
version = "0.1.0"
edition = "2024"

[dependencies]
libm = "0.2.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
wasm-bindgen = { version = "0.2.130", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The wasm-bindgen surface lexide-speech's worker loads.
web = ["dep:wasm-bindgen"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
