# Train one language from its feature manifests and optional phoneme encoder.
# Features come from the HF dataset (scripts/push_features.py), never with workdir (.skyignore).
resources:
  cloud: lambda
  accelerators: A100:1
  disk_size: 100
  autostop:
    idle_minutes: 5
    down: true

workdir: .

# Pass with --secret HF_TOKEN --secret WANDB_API_KEY (values from the local environment).
secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null

setup: |
  set -euo pipefail
  pip install --index-url https://download.pytorch.org/whl/cu128 torch
  pip install -U brotli  # the image's Brotli 1.0.9 breaks huggingface_hub downloads of compressed files
  pip install librosa soundfile numpy scipy huggingface_hub wandb transformers praat-parselmouth
  python -c 'import torch; assert torch.cuda.is_available(), "CUDA required"; print(torch.__version__, torch.cuda.get_device_name())'

run: |
  set -euo pipefail
  cd ~/sky_workdir
  # One model per language: its frontend (voca/inventories/$LANGUAGE.json), features and sample script.
  export VOCA_LANGUAGE=${LANGUAGE:-eng}
  RUN=runs/${RUN_NAME:-eng-gemini}
  FEATURES=features/${FEATURES:-${VOCA_LANGUAGE}_gemini_multi_v1}
  # Feature sets too big to upload with workdir (.skyignore) live as one tar in
  # the private dataset anchpop/lexide-tts-features (scripts/push_features.py).
  fetch_features() {
    if [ ! -f "$1/train.jsonl" ]; then
      TAR=$(python -c "import sys; from huggingface_hub import hf_hub_download as d; print(d('anchpop/lexide-tts-features', sys.argv[1] + '.tar', repo_type='dataset'))" "$(basename "$1")")
      mkdir -p features && tar xf "$TAR" -C features && rm -f "$TAR"
    fi
  }
  fetch_features "$FEATURES"
  ROOT=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["acoustic_root"])' "$FEATURES/annotations.json")
  fetch_features "$(realpath -m "$FEATURES/$ROOT")"
  # PHONEME_ENCODER=phonebert-eng/encoder.pt: a voca.phonebert run's encoder, from the runs repo.
  ENCODER=${PHONEME_ENCODER:+$(python -c "import sys; from huggingface_hub import hf_hub_download as d; print(d('anchpop/lexide-tts-runs', sys.argv[1]))" $PHONEME_ENCODER)}
  # Clusters tear themselves down 5 idle minutes after the job: push the run to HF as it goes, with the code it runs.
  tar czf /tmp/code.tar.gz --exclude __pycache__ voca scripts configs tests sky_train.yaml README.md
  (while true; do sleep 300; cp /tmp/code.tar.gz $RUN/ && python scripts/sync_run.py $RUN || true; done) &
  SYNC=$!
  trap "kill $SYNC 2>/dev/null || true" EXIT   # a failed step must not leave the job alive, holding the GPU
  python -m voca.train ${CONFIG:+--config $CONFIG} ${ENCODER:+--phoneme-encoder $ENCODER} --train $FEATURES/train.jsonl --validation $FEATURES/validation.jsonl \
    --output $RUN --steps ${STEPS:-40000} --gan-start ${GAN_START:-8000} --teacher-final 0 \
    --max-batch ${MAX_BATCH:-32} --max-seconds ${MAX_SECONDS:-18000} --save-every 2000 --keep-every 10000 --log-every 50 ${EXTRA_ARGS:-}
  # Every voice reads the same validation sentences.
  SCRIPT=data/scripts/${VOCA_LANGUAGE}_achernar.jsonl
  for SPEAKER in $(python -c "import json, sys; print(' '.join(json.load(open(sys.argv[1]))['speakers']))" $RUN/config.json); do
    python -m voca.speak --checkpoint $RUN/inference.pt --script $SCRIPT --split validation --speaker $SPEAKER \
      --output $RUN/samples-validation/$SPEAKER --device cuda
  done
  python -m voca.speak --checkpoint $RUN/inference.pt --script $SCRIPT --split validation \
    --output $RUN/samples-cpu-timing --device cpu --limit 20
  kill $SYNC
  python scripts/sync_run.py $RUN
