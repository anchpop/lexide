# Shallow flow-matching refiner (voca.refine) on a frozen trained model.
# Copy the base checkpoint to bases/ first (runs/ is not uploaded).
resources:
  cloud: lambda
  accelerators: A100:1
  disk_size: 100
  autostop:
    idle_minutes: 5
    down: true

workdir: .

# Pass with --secret HF_TOKEN --secret WANDB_API_KEY (values from the local environment).
secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null

setup: |
  set -euo pipefail
  pip install --index-url https://download.pytorch.org/whl/cu128 torch
  pip install librosa soundfile numpy scipy huggingface_hub wandb
  python -c 'import torch; assert torch.cuda.is_available(), "CUDA required"; print(torch.__version__, torch.cuda.get_device_name())'

run: |
  set -euo pipefail
  cd ~/sky_workdir
  BASE=bases/${BASE:-eng-gemini}.pt
  RUN=runs/${RUN_NAME:-eng-gemini-refiner}
  FEATURES=features/${FEATURES:-eng_gemini_achernar}
  # Clusters tear themselves down 5 idle minutes after the job: push the run to HF as it goes.
  (while true; do sleep 300; python scripts/sync_run.py $RUN || true; done) &
  SYNC=$!
  trap "kill $SYNC 2>/dev/null || true" EXIT   # a failed step must not leave the job alive, holding the GPU
  python -m voca.refine --base $BASE --train $FEATURES/train.jsonl --validation $FEATURES/validation.jsonl \
    --output $RUN --steps ${STEPS:-30000} --max-seconds 9000
  python -m voca.speak --checkpoint $BASE --refiner $RUN/refiner.pt --script data/eng_script.jsonl --split validation \
    --output $RUN/samples-validation --device cuda
  python -m voca.speak --checkpoint $BASE --refiner $RUN/refiner.pt --script data/eng_script.jsonl --split validation \
    --output $RUN/samples-cpu-timing --device cpu --limit 20
  kill $SYNC
  python scripts/sync_run.py $RUN
